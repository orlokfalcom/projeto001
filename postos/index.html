<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa CNES Brasil — Sem API</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --bg: #f3f7f7;
      --panel: #ffffff;
      --panel-alt: #edf7f4;
      --primary: #146a52;
      --primary-dark: #0f563f;
      --text: #172334;
      --muted: #5a6977;
      --border: #d8e1e7;
      --shadow: 0 10px 22px rgba(18, 76, 64, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      padding: 16px 20px 14px;
      background: linear-gradient(135deg, #0f4d42, #146a52);
      color: #fff;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      font-weight: 700;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 12px;
      letter-spacing: 0.03em;
    }

    .subheader {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: 0.9;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .controls > * {
      min-height: 42px;
    }

    .search-wrap {
      flex: 2 1 260px;
    }

    .filter {
      flex: 1 1 180px;
    }

    input, select, button {
      width: 100%;
      height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    input:focus, select:focus, button:focus {
      outline: 2px solid rgba(20, 106, 82, 0.18);
      outline-offset: 1px;
    }

    input[type="search"] {
      min-width: 220px;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex: 1 1 220px;
    }

    button {
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease, background 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary-btn {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 600;
    }

    .secondary-btn {
      background: #edf6f2;
      color: var(--primary-dark);
      border-color: #cfe3dc;
      font-weight: 600;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 12px;
      padding: 14px 16px 0;
      background: var(--bg);
    }

    .summary-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 5px 12px rgba(20, 30, 40, 0.04);
    }

    .summary-card span {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .summary-card strong {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 700;
      color: var(--primary-dark);
    }

    .status {
      padding: 10px 16px 0;
      font-size: 13px;
      color: var(--muted);
    }

    #map {
      flex: 1;
      min-height: 420px;
      height: calc(100vh - 240px);
      margin: 12px 16px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #dfeef5;
      box-shadow: var(--shadow);
    }

    .leaflet-popup-content {
      line-height: 1.6;
      max-height: 300px;
      overflow: auto;
      margin: 10px 12px;
      color: var(--text);
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    }

    .popup-title {
      display: block;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary-dark);
    }

    .popup-item {
      margin: 4px 0;
    }

    .popup-item strong {
      color: var(--text);
    }

    .popup-note {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    @media (max-width: 768px) {
      header {
        align-items: start;
        flex-direction: column;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      #map {
        height: 62vh;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Mapa de estabelecimentos de saúde — CNES Brasil</h1>
      <p class="subheader">Leaflet + OpenStreetMap · Sem chave de API</p>
    </div>
    <span class="badge">Dados cadastrais</span>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <input id="busca" type="search" placeholder="Pesquisar nome, CNES, bairro, endereço..." aria-label="Pesquisar estabelecimento">
    </div>
    <select id="uf" class="filter" aria-label="Filtrar por UF">
      <option value="">Todas as UFs</option>
    </select>
    <select id="categoria" class="filter" aria-label="Filtrar por categoria">
      <option value="">Todas as categorias</option>
    </select>
    <div class="button-group">
      <button id="limpar" type="button" class="secondary-btn">Limpar filtros</button>
      <button id="importar" type="button" class="primary-btn">Importar GeoJSON</button>
      <input type="file" id="arquivo" accept=".geojson,.json,application/json" hidden>
    </div>
  </div>

  <div class="summary" aria-live="polite">
    <div class="summary-card">
      <span>Exibidos</span>
      <strong id="card-exibidos">0</strong>
    </div>
    <div class="summary-card">
      <span>Total</span>
      <strong id="card-total">0</strong>
    </div>
    <div class="summary-card">
      <span>UFs</span>
      <strong id="card-ufs">0</strong>
    </div>
  </div>

  <div class="status" id="status">Carregando dados...</div>
  <div id="map" aria-label="Mapa com estabelecimentos de saúde"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (() => {
      const map = L.map('map', { zoomControl: true }).setView([-14.2, -51.9], 4);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      const refs = {
        busca: document.querySelector('#busca'),
        uf: document.querySelector('#uf'),
        categoria: document.querySelector('#categoria'),
        status: document.querySelector('#status'),
        arquivo: document.querySelector('#arquivo'),
        limpar: document.querySelector('#limpar'),
        importar: document.querySelector('#importar'),
        exibidos: document.querySelector('#card-exibidos'),
        total: document.querySelector('#card-total'),
        ufs: document.querySelector('#card-ufs')
      };

      let dados = [];
      const layer = L.layerGroup().addTo(map);
      const categoryColors = {
        Hospital: '#8b5cf6',
        'UPA': '#f59e0b',
        'UBS / Posto de saúde': '#10b981',
        'Centro de Saúde': '#0ea5e9',
        Clinica: '#ef4444',
        'Pronto Atendimento': '#f97316'
      };

      function normalizeText(value) {
        return String(value ?? '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase();
      }

      function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, (char) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[char]));
      }

      function getProperty(properties, ...keys) {
        if (!properties) return '';
        for (const key of keys) {
          if (Object.prototype.hasOwnProperty.call(properties, key)) {
            const value = properties[key];
            if (value !== undefined && value !== null && String(value).trim() !== '') {
              return value;
            }
          }
        }
        return '';
      }

      function fillSelect(select, values, label) {
        select.innerHTML = '';
        const placeholder = new Option(label, '');
        select.add(placeholder);

        [...new Set(values.filter(Boolean))]
          .sort((a, b) => a.localeCompare(b, 'pt-BR'))
          .forEach((value) => select.add(new Option(value, value)));
      }

      function pickCategoryColor(category) {
        const normalized = String(category ?? '').trim();
        return categoryColors[normalized] || '#146a52';
      }

      function buildPopup(feature) {
        const props = feature.properties || {};
        const nome = getProperty(props, 'nome', 'name', 'titulo', 'estabelecimento') || 'Estabelecimento';
        const categoria = getProperty(props, 'categoria', 'tipo', 'classe', 'tipo_estabelecimento') || 'Não informado';
        const cnes = getProperty(props, 'CNES', 'cnes', 'codigo_cnes') || 'Não informado';
        const uf = getProperty(props, 'UF', 'uf', 'estado') || 'Não informado';
        const endereco = getProperty(props, 'endereco', 'logradouro', 'rua', 'endereço') || 'Não informado';
        const bairro = getProperty(props, 'bairro', 'bairro_nome', 'distrito') || 'Não informado';
        const cep = getProperty(props, 'CEP', 'cep') || 'Não informado';
        const telefone = getProperty(props, 'telefone_cadastrado', 'telefone', 'fone') || 'Não informado';

        return `
          <div>
            <span class="popup-title">${escapeHTML(nome)}</span>
            <div class="popup-item"><strong>Categoria:</strong> ${escapeHTML(categoria)}</div>
            <div class="popup-item"><strong>CNES:</strong> ${escapeHTML(cnes)}</div>
            <div class="popup-item"><strong>UF:</strong> ${escapeHTML(uf)}</div>
            <div class="popup-item"><strong>Endereço:</strong> ${escapeHTML(endereco)}</div>
            <div class="popup-item"><strong>Bairro:</strong> ${escapeHTML(bairro)}</div>
            <div class="popup-item"><strong>CEP:</strong> ${escapeHTML(cep)}</div>
            <div class="popup-item"><strong>Telefone cadastrado:</strong> ${escapeHTML(telefone)}</div>
            <span class="popup-note">Dados cadastrais: confirme atendimento e endereço antes de ir.</span>
          </div>
        `;
      }

      function updateSummary(exibidos, total, ufsCount) {
        refs.exibidos.textContent = exibidos.toLocaleString('pt-BR');
        refs.total.textContent = total.toLocaleString('pt-BR');
        refs.ufs.textContent = ufsCount.toLocaleString('pt-BR');
      }

      function load(rawData) {
        if (!rawData || rawData.type !== 'FeatureCollection' || !Array.isArray(rawData.features)) {
          throw new Error('Arquivo GeoJSON inválido: esperava um FeatureCollection.');
        }

        dados = rawData.features.filter((feature) => {
          const geometry = feature && feature.geometry;
          const coords = geometry && geometry.coordinates;
          return geometry && geometry.type === 'Point' && Array.isArray(coords) && coords.length >= 2 &&
            Number.isFinite(Number(coords[0])) && Number.isFinite(Number(coords[1]));
        });

        const categorias = dados.map((feature) => getProperty(feature.properties, 'categoria', 'tipo', 'classe', 'tipo_estabelecimento')).filter(Boolean);
        const ufs = dados.map((feature) => getProperty(feature.properties, 'UF', 'uf', 'estado')).filter(Boolean);

        fillSelect(refs.uf, ufs, 'Todas as UFs');
        fillSelect(refs.categoria, categorias, 'Todas as categorias');

        if (ufs.includes('MG')) {
          refs.uf.value = 'MG';
        }

        render({ fitBounds: true });
      }

      function render(options = {}) {
        const { fitBounds = false } = options;
        const query = normalizeText(refs.busca.value).trim();
        const ufValue = refs.uf.value;
        const categoriaValue = refs.categoria.value;

        layer.clearLayers();
        const matches = [];
        const bounds = [];

        for (const feature of dados) {
          const props = feature.properties || {};
          const coords = feature.geometry.coordinates;
          const [lng, lat] = coords;
          const categoria = getProperty(props, 'categoria', 'tipo', 'classe', 'tipo_estabelecimento');
          const uf = getProperty(props, 'UF', 'uf', 'estado');

          if (ufValue && uf !== ufValue) continue;
          if (categoriaValue && categoria !== categoriaValue) continue;

          const searchableText = [
            getProperty(props, 'nome', 'name', 'titulo', 'estabelecimento'),
            getProperty(props, 'CNES', 'cnes', 'codigo_cnes'),
            getProperty(props, 'UF', 'uf', 'estado'),
            getProperty(props, 'bairro', 'bairro_nome', 'distrito'),
            getProperty(props, 'endereco', 'logradouro', 'rua', 'endereço'),
            getProperty(props, 'categoria', 'tipo', 'classe', 'tipo_estabelecimento')
          ].join(' ');

          if (query && !normalizeText(searchableText).includes(query)) continue;

          const marker = L.circleMarker([lat, lng], {
            radius: 6,
            color: pickCategoryColor(categoria),
            weight: 1,
            fillColor: pickCategoryColor(categoria),
            fillOpacity: 0.75
          });

          marker.bindPopup(buildPopup(feature));
          marker.addTo(layer);
          bounds.push([lat, lng]);
          matches.push(feature);
        }

        const uniqueUfs = new Set(matches.map((feature) => getProperty(feature.properties, 'UF', 'uf', 'estado')).filter(Boolean));

        if (matches.length === 0) {
          refs.status.textContent = 'Nenhum estabelecimento encontrado com os filtros atuais.';
        } else {
          refs.status.textContent = `${matches.length.toLocaleString('pt-BR')} de ${dados.length.toLocaleString('pt-BR')} estabelecimentos exibidos.`;
        }

        updateSummary(matches.length, dados.length, uniqueUfs.size);

        if (fitBounds && bounds.length) {
          map.fitBounds(bounds, { padding: [25, 25], maxZoom: 12 });
        }
      }

      let debounceTimer;
      refs.busca.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => render(), 180);
      });

      refs.uf.addEventListener('change', () => render({ fitBounds: true }));
      refs.categoria.addEventListener('change', () => render({ fitBounds: true }));

      refs.limpar.addEventListener('click', () => {
        refs.busca.value = '';
        refs.uf.value = '';
        refs.categoria.value = '';
        render({ fitBounds: true });
      });

      refs.importar.addEventListener('click', () => refs.arquivo.click());

      refs.arquivo.addEventListener('change', async () => {
        const file = refs.arquivo.files[0];
        if (!file) return;

        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          load(parsed);
        } catch (error) {
          refs.status.textContent = 'Não foi possível importar o arquivo. Verifique se o GeoJSON está válido.';
          alert(error.message || 'Arquivo GeoJSON inválido.');
        } finally {
          refs.arquivo.value = '';
        }
      });

      fetch('./dados.geojson')
        .then((response) => {
          if (!response.ok) {
            throw new Error('Não foi possível carregar dados.geojson.');
          }
          return response.json();
        })
        .then(load)
        .catch((error) => {
          refs.status.textContent = 'Abra por um servidor local ou importe o GeoJSON pelo botão. ' + error.message;
          refs.total.textContent = '0';
          refs.exibidos.textContent = '0';
          refs.ufs.textContent = '0';
        });
    })();
  </script>
</body>
</html>
